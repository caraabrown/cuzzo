<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cuzzo — Planning Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter+Tight:wght@400;500;600;700&family=Archivo+Black&display=swap" rel="stylesheet">

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

<style>
  :root{
    --bg:#0a0a0b;
    --bg-panel:#101413;
    --bg-raised:#161c1b;
    --border:#232b2a;
    --text:#f5f5f2;
    --text-dim:#9aa5a3;
    --text-faint:#5a6462;
    --emerald:#12b5ac;
    --emerald-dim:#0d2e2c;
    --sapphire:#2dd4c4;
    --sapphire-dim:#0f3230;
    --amethyst:#12b5ac;
    --amethyst-dim:#0d2e2c;
    --ruby:#ed1c24;
    --ruby-dim:#3a0c0e;
    --gold:#f2555a;
    --gold-dim:#3d1418;
    --radius:10px;
  }

  *{box-sizing:border-box;margin:0;padding:0;}

  body{
    background:
      radial-gradient(circle at 15% 0%, rgba(18,181,172,0.08), transparent 45%),
      radial-gradient(circle at 90% 10%, rgba(45,212,196,0.06), transparent 40%),
      var(--bg);
    color:var(--text);
    font-family:'Inter Tight', sans-serif;
    min-height:100vh;
    line-height:1.5;
  }

  h1,h2,h3{
    font-family:'Oswald', sans-serif;
    text-transform:uppercase;
    letter-spacing:0.03em;
    font-weight:600;
  }

  ::selection{background:var(--amethyst-dim);color:var(--text);}

  a{color:var(--sapphire);}

  header{
    padding:28px 32px 20px;
    border-bottom:1px solid var(--border);
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
    flex-wrap:wrap;
    gap:16px;
  }

  header .title-block h1{
    font-size:28px;
    color:var(--ruby);
  }
  header .title-block p{
    color:var(--text-dim);
    font-size:13px;
    margin-top:4px;
    letter-spacing:0.02em;
  }

  #sync-status{
    display:flex;
    align-items:center;
    gap:8px;
    font-size:12px;
    color:var(--text-dim);
    font-family:'Inter Tight',sans-serif;
    text-transform:uppercase;
    letter-spacing:0.06em;
  }
  #sync-dot{
    width:8px;height:8px;border-radius:50%;
    background:var(--gold);
    transition:background 0.3s;
  }
  #sync-dot.live{background:var(--emerald);box-shadow:0 0 8px var(--emerald);}
  #sync-dot.error{background:var(--ruby);}

  nav{
    display:flex;
    gap:2px;
    padding:0 32px;
    border-bottom:1px solid var(--border);
    overflow-x:auto;
    background:rgba(255,255,255,0.01);
  }
  nav button{
    background:none;
    border:none;
    color:var(--text-dim);
    font-family:'Oswald',sans-serif;
    text-transform:uppercase;
    letter-spacing:0.04em;
    font-size:13px;
    padding:16px 18px;
    cursor:pointer;
    border-bottom:2px solid transparent;
    white-space:nowrap;
    display:flex;
    align-items:center;
    gap:8px;
    transition:color 0.15s;
  }
  nav button svg{width:15px;height:15px;flex-shrink:0;}
  nav button:hover{color:var(--text);}
  nav button.active{color:var(--text);border-bottom-color:var(--ruby);}

  main{
    padding:28px 32px 60px;
    max-width:1100px;
    margin:0 auto;
  }

  .panel{display:none;}
  .panel.active{display:block;animation:fadein 0.25s ease;}
  @keyframes fadein{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:translateY(0);}}

  .panel-head{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:18px;
    flex-wrap:wrap;
    gap:10px;
  }
  .panel-head h2{font-size:20px;color:var(--text);}
  .panel-head p.sub{color:var(--text-dim);font-size:13px;margin-top:2px;text-transform:none;letter-spacing:0;font-family:'Inter Tight',sans-serif;}

  .card{
    background:var(--bg-panel);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:20px;
    margin-bottom:16px;
  }

  label{
    display:block;
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:0.06em;
    color:var(--text-dim);
    margin-bottom:6px;
    margin-top:14px;
  }
  label:first-of-type{margin-top:0;}

  input[type=text], input[type=date], input[type=url], textarea, select{
    width:100%;
    background:var(--bg-raised);
    border:1px solid var(--border);
    border-radius:6px;
    padding:10px 12px;
    color:var(--text);
    font-family:'Inter Tight',sans-serif;
    font-size:14px;
  }
  input:focus, textarea:focus, select:focus{
    outline:none;
    border-color:var(--amethyst);
  }
  textarea{resize:vertical;min-height:70px;}

  .row{display:flex;gap:12px;flex-wrap:wrap;}
  .row > div{flex:1;min-width:180px;}

  button.primary{
    background:var(--amethyst);
    color:#fff;
    border:none;
    border-radius:6px;
    padding:10px 20px;
    font-family:'Oswald',sans-serif;
    text-transform:uppercase;
    letter-spacing:0.04em;
    font-size:13px;
    cursor:pointer;
    margin-top:16px;
    transition:background 0.15s;
  }
  button.primary:hover{background:#1ed8cd;}

  button.ghost{
    background:none;
    border:1px solid var(--border);
    color:var(--text-dim);
    border-radius:6px;
    padding:6px 12px;
    font-size:12px;
    cursor:pointer;
    font-family:'Inter Tight',sans-serif;
  }
  button.ghost:hover{color:var(--text);border-color:var(--text-dim);}

  .item{
    background:var(--bg-panel);
    border:1px solid var(--border);
    border-left:3px solid var(--text-faint);
    border-radius:var(--radius);
    padding:16px 18px;
    margin-bottom:10px;
  }
  .item.status-yes{border-left-color:var(--emerald);}
  .item.status-no{border-left-color:var(--ruby);}
  .item.status-maybe{border-left-color:var(--gold);}
  .item.status-archive{border-left-color:var(--text-faint);opacity:0.55;}
  .item.status-new{border-left-color:var(--sapphire);}

  .item-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;}
  .item-title{font-size:15px;font-weight:600;color:var(--text);}
  .item-notes{color:var(--text-dim);font-size:13px;margin-top:6px;white-space:pre-wrap;}
  .item-meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;}

  .tag{
    font-size:10px;
    text-transform:uppercase;
    letter-spacing:0.05em;
    padding:3px 8px;
    border-radius:20px;
    background:var(--bg-raised);
    color:var(--text-dim);
    border:1px solid var(--border);
  }
  .tag.emerald{color:var(--emerald);border-color:var(--emerald-dim);background:var(--emerald-dim);}
  .tag.ruby{color:var(--ruby);border-color:var(--ruby-dim);background:var(--ruby-dim);}
  .tag.gold{color:var(--gold);border-color:var(--gold-dim);background:var(--gold-dim);}
  .tag.sapphire{color:var(--sapphire);border-color:var(--sapphire-dim);background:var(--sapphire-dim);}

  .inspo-links{margin-top:8px;display:flex;flex-direction:column;gap:4px;}
  .inspo-links a{font-size:12px;color:var(--sapphire);text-decoration:none;word-break:break-all;}
  .inspo-links a:hover{text-decoration:underline;}

  .status-select{
    width:auto;
    padding:6px 10px;
    font-size:12px;
  }

  .del-btn{
    background:none;border:none;color:var(--text-faint);cursor:pointer;font-size:16px;
    line-height:1;padding:2px 6px;
  }
  .del-btn:hover{color:var(--ruby);}

  .filter-row{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;}
  .filter-chip{
    background:var(--bg-panel);
    border:1px solid var(--border);
    color:var(--text-dim);
    padding:6px 14px;
    border-radius:20px;
    font-size:12px;
    cursor:pointer;
    text-transform:uppercase;
    letter-spacing:0.04em;
  }
  .filter-chip.active{background:var(--amethyst-dim);color:var(--text);border-color:var(--amethyst);}

  .empty-state{
    color:var(--text-faint);
    font-size:13px;
    text-align:center;
    padding:30px 0;
    font-style:italic;
  }

  /* icons */
  .icon{stroke:currentColor;fill:none;stroke-width:1.6;}

  /* footer */
  footer{
    border-top:1px solid var(--border);
    padding:24px 32px;
    color:var(--text-faint);
    font-size:12px;
  }
  footer .foot-row{
    display:flex;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:8px;
    max-width:1100px;
    margin:0 auto;
  }
  footer .foot-row:first-child{margin-bottom:10px;color:var(--text-dim);}
  footer strong{color:var(--text);font-family:'Oswald',sans-serif;letter-spacing:0.04em;}

  textarea#format-doc{min-height:340px;font-size:14px;line-height:1.7;}

  @media(max-width:640px){
    header, nav, main, footer{padding-left:16px;padding-right:16px;}
    header{flex-direction:column;align-items:flex-start;}
  }
  .home-section-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;}
  .inline-form{margin-bottom:16px;}

  .quote-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;}
  .quote-card{background:var(--bg-raised);border:1px solid var(--border);border-radius:var(--radius);padding:16px;position:relative;}
  .quote-text{font-size:14px;font-style:italic;color:var(--text);line-height:1.5;}
  .quote-author{font-size:12px;color:var(--text-dim);margin-top:8px;}
  .quote-card .del-btn{position:absolute;top:6px;right:6px;}

  .timeline-line{position:relative;padding-left:22px;border-left:2px solid var(--border);}
  .timeline-point{position:relative;margin-bottom:20px;padding-left:14px;}
  .timeline-point:last-child{margin-bottom:0;}
  .timeline-dot{position:absolute;left:-29px;top:3px;width:10px;height:10px;border-radius:50%;background:var(--ruby);border:2px solid var(--bg);}
  .timeline-content{position:relative;padding-right:24px;}
  .timeline-content .del-btn{position:absolute;top:-2px;right:0;}

  .tile-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;}
  .format-tile{background:var(--bg-raised);border:1px solid var(--border);border-radius:var(--radius);padding:14px;}
  .tile-label{font-size:11px;text-transform:uppercase;letter-spacing:0.05em;color:var(--text-dim);margin-bottom:6px;}
  .tile-value{font-size:14px;color:var(--text);cursor:pointer;min-height:20px;}
  .tile-value:hover{color:var(--ruby);}

  .topic-pool{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px;min-height:44px;padding:12
